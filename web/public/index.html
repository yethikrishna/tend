<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tend  -  an Alexa+ care companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div><span class="brand">Tend<span class="dot">.</span></span> <span class="tag">an Alexa+ care companion</span></div>
  <nav>
    <a href="/" class="on">Conversation</a>
    <a href="/dashboard.html">Family dashboard</a>
  </nav>
</header>

<main class="stage">
  <div class="orb-wrap">
    <div class="orb listening" id="orb"></div>
    <div class="orb-label" id="orbLabel">Tend is ready for your text</div>
  </div>
  <div class="thread" id="thread"></div>
</main>

<div class="composer">
  <div class="composer-inner">
    <input id="inp" type="text" autocomplete="off" placeholder='Type to Tend  -  try "Good morning"' />
    <button id="send">Send</button>
  </div>
  <div class="hint">A simulated Alexa+ experience. Care actions use live MCP calls. No automatic calls or notifications.</div>
</div>

<script src="app.js"></script>
</body>
</html>
